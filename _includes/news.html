<div class="well">
  <h4><b>News</b></h4>

  <div class="news-spread-list">
    {% for article in site.data.news limit:4 %}
      <article class="news-spread-item">
        <p><b>{{ article.date }}</b></p>
        <div class="news-spread-body">
          {{ article.headline | markdownify }}
        </div>
      </article>
    {% endfor %}
  </div>

  <h4>
    <a href="{{ site.url }}{{ site.baseurl }}/allnews.html">
      ... see all News
    </a>
  </h4>
</div>
