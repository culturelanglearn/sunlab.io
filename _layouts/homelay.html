---
layout: default
---

<div class="row">
  <!-- NEW CODE: Full width title and News on top -->
  <div class="col-sm-12">
    <h1>Welcome to the <br>Culture, Language & Learning Lab</h1>
    
    <div id="newsid" style="margin-bottom: 30px;">
      <hr>
      <h3>Latest News</h3>
      
      <!-- Logic to show only the 3 most recent news items -->
      <table class="table table-sm table-borderless">
        {% for item in site.data.news limit: 3 %}
          <tr>
            <th scope="row" style="width: 20%; min-width: 100px;">{{ item.date }}</th>
            <td>
              {% if item.inline %}
                {{ item.content | markdownify }}
              {% else %}
                <a class="news-title" href="{{ item.url | relative_url }}">{{ item.title }}</a>
              {% endif %}
            </td>
          </tr>
        {% endfor %}
      </table>

      <hr>
    </div>

    {{ content }}
  </div>
