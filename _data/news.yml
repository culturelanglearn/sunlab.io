- date: August 12 2026
  headline: >-
    Professor Sun co-authored a science communication article with Yuhan Wang for an Official Account MsMuses, exploring cultural differences in beliefs about effort, intelligence, and academic achievement.
    <a href="https://mp.weixin.qq.com/s/ro4_H_n3TRDJgcJtHYkojQ" target="_blank" rel="noopener noreferrer">Read the article on WeChat (in Chinese).</a>


- date: August 5 2026
  headline: >-
    Professor Sun was invited as a guest speaker on the podcast 小孩发射计划 to discuss bilingual development, Chinese heritage-language learning, and cultural identity among children growing up overseas.
    <a href="https://www.xiaoyuzhoufm.com/episode/6a725544ab3a91c24a0fdf9c" target="_blank" rel="noopener noreferrer">Listen to the episode on Xiaoyuzhou (in Chinese).</a>
- date: July 16 2026
  headline: "Congratulations to Professor Sun on her newest publication: <a href='https://www.sciencedirect.com/science/article/pii/S1878929326001258'>Meanings within words: How Chinese bilingualism shapes the neural basis of English morphological processing in preschoolers</a>! <br><br> <img src='https://culturelanglearn.github.io/sunlab.io/images/news/July16_2026.png' style='max-width: 100%; max-height: 150px; width: auto; height: auto; display: block; margin-top: 10px; margin-bottom: 10px; border-radius: 5px;'> <br> Check out more publications [here](https://culturelanglearn.github.io/sunlab.io/publications)."


- date: July 13 2026
  headline: "Welcome our new lab manager and research assistant, April! April recently completed her Master of Education at the University of Hong Kong and is excited to work with Professor Sun again."


- date: July 6 2026
  headline: "We are pleased to share Professor Sun's latest publication: <a href='https://academic.oup.com/cdpers/advance-article/doi/10.1093/cdpers/aadag009/8724234'>Chinese learners' theories of effort, ability, and academic performance</a>! <br><br> <img src='https://culturelanglearn.github.io/sunlab.io/images/news/July6_2026.png' style='max-width: 100%; max-height: 100px; display: block; margin-top: 10px; margin-bottom: 10px; border-radius: 5px;'> <br> Check out more publications [here](https://culturelanglearn.github.io/sunlab.io/publications)."


- date: May 5 2026
  headline: "Congratulations to Professor Sun for receiving the 2026 PolyU Young Innovative Researcher Award (YIRA)! The YIRA is a prestigious university-level award that honours young faculty members who have demonstrated originality, contributed to technological advancement, and propelled transformational innovation into solutions addressing global challenges through their research. <br><br> <img src='https://culturelanglearn.github.io/sunlab.io/images/news/YIRA.png' style='max-width: 100%; max-height: 100px; display: block; margin-top: 10px; margin-bottom: 10px; border-radius: 5px;'> <br> Check out this [article](https://www.polyu.edu.hk/fh/news-and-events/news/2026/prof-sun-xin-receives-the-polyu-yira-2026/) for more information on the award."


- date: March 30 2026
  headline: "Take a look at Professor Sun's two newest publications: <a href= 'https://www.nature.com/articles/s41539-026-00406-w'>Functional connectivity fingerprints of emerging reading skill in the first months of schooling</a> and <a href='https://www.nature.com/articles/s41539-026-00406-w'>Growth mindsets are less endorsed and less associated with academic performance in non-WEIRD cultures</a>! <br><br> <img src='https://culturelanglearn.github.io/sunlab.io/images/news/March30_1.png' style='max-width: 100%; max-height: 100px; display: block; margin-top: 10px; margin-bottom: 10px; border-radius: 5px;'> <br> Check out more publications [here](https://culturelanglearn.github.io/sunlab.io/publications)."  
