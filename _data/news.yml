- date: July 16 2026
  headline: "Congratulations to Dr. Sun on her newest publication: <a href='https://www.sciencedirect.com/science/article/pii/S1878929326001258'>Meanings within words: How Chinese bilingualism shapes the neural basis of English morphological processing in preschoolers</a>! <br><br> <img src='https://culturelanglearn.github.io/sunlab.io/images/news/July16_2026.png' style='width: 100%; max-width: 750px; height: auto; display: block; margin-top: 10px; margin-bottom: 15px; border-radius: 5px;'> Check out more publications [here](https://culturelanglearn.github.io/sunlab.io/publications)."

