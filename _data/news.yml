  headline: "We are pleased to share Dr. Sun's latest publication: <a href='https://academic.oup.com/cdpers/advance-article/doi/10.1093/cdpers/aadag009/8724234'>Chinese learners' theories of effort, ability, and academic performance</a>! <br><br> <img src='https://culturelanglearn.github.io/sunlab.io/images/news/July6_2026.png' style='width: 100%; max-width: 750px; height: auto; display: block; margin-top: 10px; margin-bottom: 15px; border-radius: 5px;'> Check out more publications [here](https://culturelanglearn.github.io/sunlab.io/publications)."

- date: May 5 2026
  headline: "Congratulations to Dr. Sun for receiving the 2026 PolyU Young Innovative Researcher Award (YIRA)! The YIRA is a prestigious university-level award that honours young faculty members who have demonstrated originality, contributed to technological advancement, and propelled transformational innovation into solutions addressing global challenges through their research. <br><br> <img src='https://culturelanglearn.github.io/sunlab.io/images/news/YIRA.png' style='max-width: 100%; max-height: 100px; display: block; margin-top: 10px; margin-bottom: 10px; border-radius: 5px;'> <br> Check out this [article](https://www.polyu.edu.hk/fh/news-and-events/news/2026/prof-sun-xin-receives-the-polyu-yira-2026/) for more information on the award."

- date: March 30 2026
  headline: "Take a look at Dr. Sun's two newest publications: <a href= 'https://www.nature.com/articles/s41539-026-00406-w'>Functional connectivity fingerprints of emerging reading skill in the first months of schooling</a> and <a href='https://www.nature.com/articles/s41539-026-00406-w'>Growth mindsets are less endorsed and less associated with academic performance in non-WEIRD cultures</a>! <br><br> <img src='https://culturelanglearn.github.io/sunlab.io/images/news/March30_1.png' style='max-width: 100%; max-height: 100px; display: block; margin-top: 10px; margin-bottom: 10px; border-radius: 5px;'> <br> Check out more publications [here](https://culturelanglearn.github.io/sunlab.io/publications)."  
  
